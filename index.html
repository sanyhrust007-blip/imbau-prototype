<style>
/* Оболонка: навігація зліва, макет у центрі, нотатки справа. Макет завжди «папір», оболонка стежить за темою. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141916;--panel:#1c2320;--fg:#e6ece8;--muted:#9aa8a1;--line:#323d38;--accent:#8fd65f;--accent-soft:#25341d;--warn:#f0c668;--warn-soft:#3a2f14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141916;--panel:#1c2320;--fg:#e6ece8;--muted:#9aa8a1;--line:#323d38;--accent:#8fd65f;--accent-soft:#25341d;--warn:#f0c668;--warn-soft:#3a2f14;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f);margin:0}

.shell-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.shell-top b{font-size:15px}
.shell-top .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:var(--fg);border:0;padding:5px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.shell-sel{display:none;min-width:0;max-width:100%;flex:1 1 220px;padding:6px 8px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;align-items:start}
.nav,.notes{background:var(--panel);position:sticky;top:0;max-height:100vh;max-height:100dvh;overflow:auto;padding:14px}
.nav{border-right:1px solid var(--line)}.notes{border-left:1px solid var(--line)}

.stage{min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.pagehead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}

.frame{margin-inline:auto;width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden;overflow:clip}

.notes h2{font-size:15px;margin:0 0 8px}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:5px;padding:4px 9px;cursor:pointer;font-size:13px}

.note{padding:8px;border-radius:6px;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.42;cursor:pointer;border:1px solid transparent}
.note:hover{background:var(--accent-soft)}.note.on{border-color:var(--accent);background:var(--accent-soft)}

@media (max-width:1359px){.shell{grid-template-columns:230px minmax(0,1fr)}.shell.ov{grid-template-columns:230px minmax(0,1fr)}.notes{grid-column:2;position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:900px){.shell,.shell.ov{grid-template-columns:minmax(0,1fr)}.nav{display:none}.nav.open{display:block;position:fixed;inset:0 auto 0 0;width:min(85vw,300px);z-index:70;box-shadow:0 0 30px #0006;padding-top:max(14px,env(safe-area-inset-top,0px))}.notes{grid-column:1}#navbtn{display:inline-flex}}

/* Каркас макета: свої кольори, не залежить від теми */

.wrap{padding-inline:12px;display:flex;flex-direction:column;gap:18px;padding-block:14px}

.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--i);background:#fff;color:var(--i);border-radius:5px;padding:9px 13px;font-weight:600;cursor:pointer;text-decoration:none;min-height:42px;font-size:14px;text-align:center}
.btn.p{background:var(--g);border-color:var(--gd)}.btn.l{border-color:var(--l);font-weight:500}.btn.sm{padding:4px 9px;min-height:34px;font-size:13px}.btn.w{width:100%}

.mut{color:var(--m);font-size:13px}.sm{font-size:13px}.b{font-weight:600}.price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.price.xl{font-size:30px}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th,.tbl td{border:1px solid var(--l);padding:6px 8px;text-align:left;vertical-align:top}.tbl th{background:var(--s);font-weight:600}

.field{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}.field input,.field select,.field textarea{border:1px solid var(--l);border-radius:5px;padding:9px;background:#fff;color:var(--i);width:100%;font-size:15px}

.crumbs{font-size:12.5px;color:var(--m);display:flex;gap:5px;flex-wrap:wrap}.crumbs a{color:var(--m)}
.tabsw{display:flex;gap:2px;border-bottom:1px solid var(--l);overflow-x:auto;scrollbar-width:thin}.tabsw button{border:0;background:transparent;padding:8px 11px;white-space:nowrap;cursor:pointer;color:var(--i);border-bottom:2px solid transparent;font-size:14px}.tabsw button[aria-selected="true"]{border-color:var(--gd);font-weight:600}

.g2>.field,.g3>.field,.g4>.field{justify-content:flex-end}.bx.col>.btn:last-child{margin-top:auto}.tile>.btn:last-child{margin-top:auto}
.lines>*{height:9px;background:#e6e9e7;border-radius:2px;margin-bottom:7px}.lines>*:nth-child(3n){width:72%}

.hd-nav{display:none}.hd-d{display:none}
.drawer{position:absolute;inset:0;z-index:40;background:#0006}

.dr-x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--i)}
.ftr{background:#3a403d;color:#fff;padding:0 12px;margin-top:10px;font-size:13.5px}.ftr a{color:#fff;display:block;padding:4px 0}
.fgrid{display:grid;gap:0;padding-block:8px;grid-template-columns:minmax(0,1fr)}
.fcol{border-bottom:1px solid #fff3;padding-block:8px}.fcol summary{font-weight:600;cursor:pointer;padding:4px 0;min-height:32px}.fcol span{display:block;padding:2px 0}
.fbar{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;padding-block:10px;border-top:1px solid #fff3;font-size:12.5px}.fbar .row{gap:4px 12px}.fbar a{padding:2px 0}.flegal{opacity:.85}
.flink{background:transparent;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:2px;font-size:inherit}
.mega{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.mroots{display:flex;flex-direction:column;gap:1px;max-height:420px;overflow:auto}.mroots b{padding:7px 0 2px}.mroots button{display:flex;justify-content:space-between;gap:6px;border:0;background:transparent;text-align:left;padding:7px 6px;min-height:36px;cursor:pointer;color:var(--i);border-radius:4px;font-size:13.5px}.mroots button:hover,.mroots button.on{background:var(--s)}

.hero3{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}.hcats{display:none}.hside{display:none;grid-template-columns:minmax(0,1fr);gap:8px}

.hcats{position:relative}.hcats .hc-a{display:flex;justify-content:space-between;gap:6px;padding:4px 7px;font-size:12.5px;line-height:1.25;text-decoration:none;border-bottom:1px solid var(--s)}
.hc:hover>.hc-a,.hc:focus-within>.hc-a,.hc.open>.hc-a{background:var(--s)}

.hc-f{position:absolute;left:calc(100% + 6px);top:0;min-height:100%;width:600px;max-width:calc(100cqw - 210px);z-index:30;background:#fff;border:1px solid var(--l);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px 14px;display:flex;flex-direction:column;gap:8px;visibility:hidden;opacity:0;transition:visibility 0s .12s,opacity .1s .12s}

function demoRoute(t, d) {
  let g = d.go; const txt = t.textContent.replace(/[›✕]/g, '').trim();
  if (['category', 'hub', 'landing'].includes(g)) {
    const nm = d.name || ALLN.filter(n => txt === n || txt.includes(n)).sort((a, b) => b.length - a.length)[0];
    if (g === 'landing' && !(nm && txt === nm)) { S.land = txt; S.f = F0(); S.more = 0; return g; }
    if (nm) { if (S.catName !== nm) { S.f = F0(); S.more = 0; } S.catName = nm; g = isSec(nm) ? 'hub' : 'category'; }
  }
  if (g === 'search' && d.q !== undefined) { S.q = d.q; S.f = F0(); S.more = 0; }
  if (g === 'search' && d.q === undefined && !S.q) setTimeout(() => $('#wf-search')?.focus(), 50);
  if (g === 'login' && S.user) g = 'account';
  return g;
}
function placeOrder(items, method, tel, name) {

  S.order = o; S.orders.unshift(o); S.trk = '';
}
const telOk = v => String(v || '').replace(/\D/g, '').length >= 12;
function fieldErr(id, msg) { const e = $('#' + id); toast(msg); if (e) { e.classList.add('err'); e.focus(); e.scrollIntoView({block: 'center'}); } }
function demoClick(t, d) {

    const q = Math.max(1, +$('#oc-q')?.value || 1), id = S.oc || S.pdp, whole = UI.cur === 'cart' && S.cart.length;
    placeOrder(whole ? S.cart : [{id, pack: PROD[id].sel, qty: q}], 'call', tel, ''); if (whole) S.cart = []; closeModal(); open_('success'); return true;
  }
  if (d.addkit !== undefined) { kitRows().forEach(([i, , n]) => { if (n) addCart(i, 0, n); }); open_('cart'); return true; }
  if (d.pid) S.oc = d.pid;

  if (d.track !== undefined) { const n = $('#tr-n')?.value.trim(); if (!n) { fieldErr('tr-n', 'Вкажіть номер замовлення'); return true; } S.trk = n; shell(); return true; }

  if (p.cat === 'sheet') { const n = Math.ceil(area * 1.1 / 3); r.innerHTML = `<b>${n} ${n === 1 ? 'лист' : 'листів'}</b> із запасом 10% · ${uah(n * c)} · ${(n * w).toFixed(0)} кг${X}`; S.need = n; return; }
